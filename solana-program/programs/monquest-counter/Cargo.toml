[package]
name = "monquest-counter"
version = "0.1.0"
description = "MonQuest example Anchor program: a permissioned counter with a stored authority"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"

[dev-dependencies]
solana-program = "1.18.26"
solana-sdk = "1.18.26"
solana-program-test = "1.18.26"